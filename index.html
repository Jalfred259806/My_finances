:root{--bg:#f6f5f2;--card:#fff;--ink:#1d1d1b;--mut:#6b6a66;--line:#e4e2dc;--acc:#2f6f4f;--inc:#2f6f4f;--exp:#b4532a;--neg:#b42a2a;--car:#3b5ba5;--soft:#f0efea}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--card:#1f1f1d;--ink:#eceae4;--mut:#9a988f;--line:#33322e;--acc:#6cc497;--inc:#6cc497;--exp:#e48a5f;--neg:#f07a7a;--car:#8aa7ec;--soft:#262623}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:90px}
.wrap{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 12px}.brand{display:flex;align-items:center;gap:10px}.brand img{width:36px;height:36px;border-radius:9px}
.sub{color:var(--mut);font-size:13px;margin-bottom:14px}
.nav{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;margin-bottom:12px}
.nav b{font-size:17px}
button{font:inherit;color:inherit;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}
button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
button.ghost{background:none;border:none;color:var(--mut);padding:6px 8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi small{display:block;color:var(--mut);font-size:12px}
.kpi div{font-size:22px;font-weight:650;font-variant-numeric:tabular-nums}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline}
.card h2 span{font-variant-numeric:tabular-nums;font-weight:600}
.row{display:flex;gap:6px;align-items:center;padding:5px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:none}
input,select{font:inherit;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:7px 8px;min-width:0}
input.n{flex:1}
input.a{width:92px;text-align:right;font-variant-numeric:tabular-nums}
select{width:96px}
.cartg{border-radius:8px;padding:6px 8px;font-size:12px;border:1px solid var(--line);background:none;color:var(--mut)}
.cartg.on{background:var(--car);border-color:var(--car);color:#fff}
.del{color:var(--mut);padding:4px 6px}
.mo{font-size:11px;color:var(--mut);width:100%;text-align:right;margin-top:-2px}
.pos{color:var(--inc)}.neg{color:var(--neg)}
.scn{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-variant-numeric:tabular-nums}
.scn .t{color:var(--mut)}
.hl{font-weight:650}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mut);margin:4px 0 6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px}
th,td{padding:6px 4px;text-align:right;border-top:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{color:var(--mut);font-weight:500}
.empty{text-align:center;padding:24px 12px}
.empty p{color:var(--mut)}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.bar span{font-size:13px;color:var(--mut)}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1}.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row.sub{border-top:none;padding-top:0;justify-content:space-between}.row.sub select{width:auto;font-size:12px;padding:4px 6px}.row.sub span{font-size:11px;color:var(--mut)}
.prog{height:10px;background:var(--soft);border-radius:6px;overflow:hidden;margin:8px 0 4px}.prog i{display:block;height:100%;background:var(--acc)}
.hdr{display:flex;gap:6px;font-size:11px;color:var(--mut);padding:0 0 4px}.hdr .n{flex:1}.hdr .a{width:72px;text-align:right}.row[data-t=assets] input.a,.row[data-t=liabilities] input.a{width:72px}
.seg{display:flex;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;margin-bottom:8px}.seg button{flex:1;border:none;background:none;padding:7px}.seg button.on{background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.12);font-weight:600}
.big{font-size:26px;font-weight:650;width:100%;text-align:center;padding:10px;font-variant-numeric:tabular-nums}
.frm{display:grid;grid-template-columns:1fr 1fr;gap:8px}.frm .full{grid-column:1/3}.frm select,.frm input{width:100%}
.cat{display:grid;grid-template-columns:22px 1fr auto;gap:2px 8px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}.cat:first-child{border-top:none}
.cat .bar2{grid-column:2/4;height:6px;background:var(--soft);border-radius:4px;overflow:hidden}.cat .bar2 i{display:block;height:100%;background:var(--exp)}.cat small{color:var(--mut)}
.day{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin:12px 0 2px;text-transform:uppercase;letter-spacing:.03em}
.tx{display:grid;grid-template-columns:22px 1fr auto 24px;gap:6px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.tx .d{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tx select{width:auto;max-width:150px;font-size:11px;padding:2px 4px;margin-top:2px;background:none;border:none;color:var(--mut)}
.tx b{font-variant-numeric:tabular-nums;font-weight:600}
.note{font-size:12px;color:var(--mut);margin-top:6px}

      h+='<div class="row" data-id="'+i.id+'" data-t="income"><input class="n" data-f="name" value="'+esc(i.name)+'" placeholder="Item"><input class="a" data-f="amt" inputmode="decimal" value="'+(i.amt||'')+'" placeholder="0"><select data-f="f">'+Object.entries(FREQ).map(([v,o])=>'<option value="'+v+'"'+(v===(i.f||'m')?' selected':'')+'>'+o.l+'</option>').join('')+'</select><button class="ghost del" data-act="del">✕</button></div>';
      h+='<div class="row sub" data-id="'+i.id+'" data-t="income"><select data-f="k">'+Object.entries(KIND).map(([v,l])=>'<option value="'+v+'"'+(v===(i.k||'w')?' selected':'')+'>'+l+'</option>').join('')+'</select><span data-mo="'+i.id+'"></span></div>';
    });
    h+='<button class="ghost" data-act="add" data-t="income">+ Add income</button></div>';
    h+='<div class="card"><h2>Expenses <span id="texp"></span></h2>';
    m.expenses.forEach(e=>{h+='<div class="row" data-id="'+e.id+'" data-t="expenses"><input class="n" data-f="name" value="'+esc(e.name)+'" placeholder="Item"><input class="a" data-f="amt" inputmode="decimal" value="'+(e.amt||'')+'" placeholder="0"><button class="cartg'+(e.car?' on':'')+'" data-act="car" title="Car expense">🚗</button><button class="ghost del" data-act="del">✕</button></div>';});
    h+='<button class="ghost" data-act="add" data-t="expenses">+ Add expense</button><div class="note">Tag car expenses with 🚗 to see the no-car scenario.</div></div>';
    h+='<div class="card"><h2>No-Car Scenario</h2><div class="scn" id="scn"></div><div class="row" style="margin-top:8px"><span style="flex:1;font-size:13px;color:var(--mut)">Estimated public transit/month</span><input class="a" id="transit" inputmode="decimal" value="'+(S.transit||0)+'"></div></div>';
    h+='<div class="card"><h2>Monthly Cash Flow</h2><div class="legend"><span><i style="background:var(--inc)"></i>Income</span><span><i style="background:var(--exp)"></i>Expenses</span></div><div id="chart"></div><div id="tbl"></div></div>';
    h+='<div style="text-align:center"><button class="ghost" data-act="delmonth">Delete '+label(k)+'</button></div>';
  }else{
    h+='<div id="rdk"></div>';
    h+='<div class="card"><h2>Income Statement</h2><div class="scn" id="is"></div><div class="note">Edit income and expenses in "Budget & Cash Flow". Classify each income as earned, passive or portfolio.</div></div>';
    h+='<div class="card"><h2>Assets <span id="tas"></span></h2><div class="note" style="margin:0 0 6px">Put money in your pocket.</div><div class="hdr"><span class="n">Asset</span><span class="a">Value</span><span class="a">Income/mo</span><span style="width:28px"></span></div>';
    S.assets.forEach(a=>{h+='<div class="row" data-id="'+a.id+'" data-t="assets"><input class="n" data-f="name" value="'+esc(a.name)+'" placeholder="Asset"><input class="a" data-f="value" inputmode="decimal" value="'+(a.value||'')+'" placeholder="0"><input class="a" data-f="cf" inputmode="decimal" value="'+(a.cf||'')+'" placeholder="0"><button class="ghost del" data-act="del">✕</button></div>';});
    h+='<button class="ghost" data-act="add" data-t="assets">+ Add asset</button></div>';
    h+='<div class="card"><h2>Liabilities <span id="tli"></span></h2><div class="note" style="margin:0 0 6px">Take money out of your pocket.</div><div class="hdr"><span class="n">Liability</span><span class="a">Balance</span><span class="a">Payment/mo</span><span style="width:28px"></span></div>';
    S.liabilities.forEach(l=>{h+='<div class="row" data-id="'+l.id+'" data-t="liabilities"><input class="n" data-f="name" value="'+esc(l.name)+'" placeholder="Liability"><input class="a" data-f="bal" inputmode="decimal" value="'+(l.bal||'')+'" placeholder="0"><input class="a" data-f="pay" inputmode="decimal" value="'+(l.pay||'')+'" placeholder="0"><button class="ghost del" data-act="del">✕</button></div>';});
    h+='<button class="ghost" data-act="add" data-t="liabilities">+ Add liability</button></div>';
  }
  h+='</div>';
  $('#root').innerHTML=h;
  if(view==='log')refreshLog();else if(m)refresh();
  renderBar();
}
function refresh(){
  if(view==='log')return refreshLog();
  if(!S.months[S.current])return;
  if(view==='rd')return refreshRD();
  const m=S.months[S.current],t=totals(m);
  const rate=t.inc>0?Math.round(t.net/t.inc*100)+'%':'—';
  $('#kpis').innerHTML='<div class="grid"><div class="kpi"><small>Income</small><div class="pos">'+fmt(t.inc)+'</div></div><div class="kpi"><small>Expenses</small><div>'+fmt(t.exp)+'</div></div><div class="kpi"><small>Net cash flow</small><div class="'+(t.net<0?'neg':'pos')+'">'+fmt(t.net)+'</div></div><div class="kpi"><small>Savings rate</small><div>'+rate+'</div></div></div>';
  $('#tinc').textContent=fmt(t.inc);$('#texp').textContent=fmt(t.exp);
  m.income.forEach(i=>{const el=document.querySelector('[data-mo="'+i.id+'"]');if(el)el.textContent=(i.f||'m')==='m'||(i.f==='u')?'':'≈ '+fmt(mo(i))+'/mo';});
  const tr=t.car>0?(+S.transit||0):0;
  $('#scn').innerHTML='<span class="t">Car expenses</span><span>'+fmt(t.car)+'</span><span class="t">+ Public transit</span><span>'+fmt(tr)+'</span><span class="t">Expenses without car</span><span class="hl">'+fmt(t.noCar)+'</span><span class="t">Net cash flow without car</span><span class="hl '+(t.netNoCar<0?'neg':'pos')+'">'+fmt(t.netNoCar)+'</span><span class="t">Extra savings per year</span><span class="hl pos">'+fmt((t.car-tr)*12)+'</span>';
  chart();
}
function refreshRD(){
  const m=S.months[S.current],t=totals(m);
  const passive=t.byK.p+t.byK.c,av=sum(S.assets,'value'),lb=sum(S.liabilities,'bal'),acf=sum(S.assets,'cf');
  const free=t.exp>0?Math.min(100,passive/t.exp*100):0;
  $('#rdk').innerHTML='<div class="grid"><div class="kpi"><small>Net worth</small><div class="'+(av-lb<0?'neg':'pos')+'">'+fmt(av-lb)+'</div></div><div class="kpi"><small>Monthly cash flow</small><div class="'+(t.net<0?'neg':'pos')+'">'+fmt(t.net)+'</div></div></div>'+
    '<div class="card"><h2>Getting out of the Rat Race <span>'+Math.round(free)+'%</span></h2><div class="prog"><i style="width:'+free+'%"></i></div><div class="note">Passive income '+fmt(passive)+' of '+fmt(t.exp)+' in expenses. You are free when passive income covers all your expenses'+(t.exp>passive?': '+fmt(t.exp-passive)+'/mo to go.':'. You made it!')+'</div></div>';
  $('#is').innerHTML='<span class="t">Earned income</span><span>'+fmt(t.byK.w)+'</span><span class="t">Passive income</span><span>'+fmt(t.byK.p)+'</span><span class="t">Portfolio income</span><span>'+fmt(t.byK.c)+'</span><span class="t hl">Total income</span><span class="hl pos">'+fmt(t.inc)+'</span>'+
    '<span class="t">Total expenses</span><span>'+fmt(t.exp)+'</span><span class="t">  of which, debt payments</span><span>'+fmt(sum(S.liabilities,'pay'))+'</span><span class="t hl">Cash flow (payday)</span><span class="hl '+(t.net<0?'neg':'pos')+'">'+fmt(t.net)+'</span>'+
    (acf>0&&Math.round(acf)!==Math.round(passive)?'<span class="t" style="grid-column:1/3;font-size:12px">Your assets generate '+fmt(acf)+'/mo. Add it as passive or portfolio income in the budget.</span>':'');
  $('#tas').textContent=fmt(av);$('#tli').textContent=fmt(lb);
}
function catOpts(type,sel){const C=type==='inc'?ICATS:CATS;return Object.entries(C).map(([v,c])=>'<option value="'+v+'"'+(v===sel?' selected':'')+'>'+c[0]+' '+c[1]+'</option>').join('');}
function logHTML(){
  const dflt=S.current===today().slice(0,7)?today():S.current+'-01';
  let h='<div class="card"><div class="seg"><button data-act="txtype" data-v="exp" class="'+(txType==='exp'?'on':'')+'">Expense</button><button data-act="txtype" data-v="inc" class="'+(txType==='inc'?'on':'')+'">Income</button></div>';
  h+='<form id="txf" class="frm"><input id="txAmt" class="big full" inputmode="decimal" placeholder="$0.00" autocomplete="off">';
  h+='<input id="txDesc" class="full" placeholder="'+(txType==='inc'?'e.g. Ecolab paycheck':'e.g. Trader Joe\'s, Uber, gas')+'" autocomplete="off">';
  h+='<select id="txCat">'+catOpts(txType,txType==='inc'?'salary':'other')+'</select><input id="txDate" type="date" value="'+dflt+'">';
  h+='<button class="pri full" type="submit">Add '+(txType==='inc'?'income':'expense')+'</button></form><div class="note">The category is picked automatically from the description. If you change it, the app learns for next time.</div></div>';
  h+='<div id="logk"></div><div class="card"><h2>Spending by category <span id="lcat"></span></h2><div id="logcat"></div></div>';
  h+='<div class="card"><h2>By week</h2><div id="logweek"></div></div><div class="card"><h2>Entries</h2><div id="loglist"></div></div>';
  return h;
}
function refreshLog(){
  const k=S.current,txs=S.tx.filter(t=>t.date.slice(0,7)===k);
  const inc=sum(txs.filter(t=>t.type==='inc'),'amt'),exp=sum(txs.filter(t=>t.type==='exp'),'amt');
  const plan=S.months[k]?totals(S.months[k]).exp:0,tdy=today();
  const spentToday=sum(txs.filter(t=>t.type==='exp'&&t.date===tdy),'amt');
  let h='<div class="grid"><div class="kpi"><small>Income logged</small><div class="pos">'+fmt(inc)+'</div></div><div class="kpi"><small>Spent</small><div>'+fmt(exp)+'</div></div><div class="kpi"><small>Net</small><div class="'+(inc-exp<0?'neg':'pos')+'">'+fmt(inc-exp)+'</div></div><div class="kpi"><small>'+(k===tdy.slice(0,7)?'Spent today':'Entries')+'</small><div>'+(k===tdy.slice(0,7)?fmt2(spentToday):txs.length)+'</div></div></div>';
  if(plan>0){const p=Math.min(100,exp/plan*100);h+='<div class="card"><h2>Spent vs. budget <span>'+Math.round(exp/plan*100)+'%</span></h2><div class="prog"><i style="width:'+p+'%;background:'+(exp>plan?'var(--neg)':'var(--acc)')+'"></i></div><div class="note">'+fmt(exp)+' of '+fmt(plan)+' planned for '+label(k)+(exp>plan?' — over by '+fmt(exp-plan):' — '+fmt(plan-exp)+' left')+'.</div></div>';}
  $('#logk').innerHTML=h;
  // categories
  const by={};txs.filter(t=>t.type==='exp').forEach(t=>by[t.cat]=(by[t.cat]||0)+(+t.amt||0));
  const rows=Object.entries(by).sort((a,b)=>b[1]-a[1]),mx=rows.length?rows[0][1]:1;
  const carT=rows.filter(([c])=>CATS[c]&&CATS[c][2]).reduce((a,r)=>a+r[1],0);
  $('#lcat').textContent=fmt(exp);
  $('#logcat').innerHTML=rows.length?rows.map(([c,v])=>{const C=CATS[c]||CATS.other;return '<div class="cat"><span>'+C[0]+'</span><span>'+C[1]+' <small>'+Math.round(v/exp*100)+'%</small></span><b>'+fmt2(v)+'</b><div class="bar2"><i style="width:'+(v/mx*100)+'%"></i></div></div>';}).join('')+(carT>0?'<div class="note">🚗 Car-related: '+fmt2(carT)+' this month.</div>':''):'<div class="note">No expenses logged in '+label(k)+' yet.</div>';
  // weeks (Mon–Sun)
  const first=pd(k+'-01'),last=new Date(first.getFullYear(),first.getMonth()+1,0);
  let ws=new Date(first);ws.setDate(ws.getDate()-((ws.getDay()+6)%7));
  let w='<table><tr><th>Week</th><th>Income</th><th>Spent</th><th>Net</th></tr>';
  while(ws<=last){const we=new Date(ws);we.setDate(we.getDate()+6);const a=ds(ws),b=ds(we);
    const wt=txs.filter(t=>t.date>=a&&t.date<=b),wi=sum(wt.filter(t=>t.type==='inc'),'amt'),wx=sum(wt.filter(t=>t.type==='exp'),'amt');
    const lab=MN[ws.getMonth()]+' '+ws.getDate()+'–'+(we.getMonth()!==ws.getMonth()?MN[we.getMonth()]+' ':'')+we.getDate();
    w+='<tr'+(a<=tdy&&tdy<=b?' style="font-weight:600"':'')+'><td>'+lab+'</td><td>'+fmt(wi)+'</td><td>'+fmt(wx)+'</td><td class="'+(wi-wx<0?'neg':'pos')+'">'+fmt(wi-wx)+'</td></tr>';
    ws.setDate(ws.getDate()+7);}
  $('#logweek').innerHTML=w+'</table>';
  // entries grouped by day
  const days={};txs.forEach(t=>(days[t.date]=days[t.date]||[]).push(t));
  $('#loglist').innerHTML=Object.keys(days).sort().reverse().map(d=>{const L=days[d],dx=sum(L.filter(t=>t.type==='exp'),'amt'),dt=pd(d);
    return '<div class="day"><span>'+['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][dt.getDay()]+' '+MN[dt.getMonth()]+' '+dt.getDate()+'</span><span>'+(dx?'-'+fmt2(dx):'')+'</span></div>'+L.slice().reverse().map(t=>{const C=(t.type==='inc'?ICATS:CATS)[t.cat]||CATS.other;
      return '<div class="tx" data-tx="'+t.id+'"><span>'+C[0]+'</span><div><div class="d">'+esc(t.desc||C[1])+'</div><select data-txcat="'+t.id+'">'+catOpts(t.type,t.cat)+'</select></div><b class="'+(t.type==='inc'?'pos':'')+'">'+(t.type==='inc'?'+':'-')+fmt2(+t.amt||0)+'</b><button class="ghost del" data-act="txdel">✕</button></div>';}).join('');}).join('')||'<div class="note">Nothing logged yet. Add your first expense above.</div>';
}
function addTx(){
  const amt=parseFloat(String($('#txAmt').value).replace(/[$,]/g,''));
  if(!(amt>0)){$('#txAmt').focus();return;}
  const desc=$('#txDesc').value.trim(),date=$('#txDate').value||today();
  S.tx.push({id:uid(),date,type:txType,amt:Math.round(amt*100)/100,desc,cat:$('#txCat').value});
  if(txManual&&desc)S.rules[txType+':'+rkey(desc)]=$('#txCat').value;
  txManual=false;touch();
  if(date.slice(0,7)!==S.current){S.current=date.slice(0,7);render();}
  else{$('#txAmt').value='';$('#txDesc').value='';$('#txCat').value=txType==='inc'?'salary':'other';refreshLog();}
  status=(txType==='inc'?'Income':'Expense')+' added: '+fmt2(amt);renderBar();$('#txAmt').focus();
}
document.addEventListener('submit',e=>{if(e.target.id==='txf'){e.preventDefault();addTx();}});
function chart(){
  const ks=keys().slice(-12),data=ks.map(k=>({k,...totals(S.months[k])}));
  const max=Math.max(1,...data.flatMap(d=>[d.inc,d.exp]));
  const W=Math.max(320,ks.length*56),H=170,bw=16,gap=W/ks.length;
  let s='<svg viewBox="0 0 '+W+' '+(H+24)+'" width="100%" style="max-height:220px">';
  data.forEach((d,i)=>{const x=i*gap+gap/2,hi=d.inc/max*H,he=d.exp/max*H,cur=d.k===S.current;
    s+='<rect x="'+(x-bw-1)+'" y="'+(H-hi)+'" width="'+bw+'" height="'+hi+'" rx="3" fill="var(--inc)" opacity="'+(cur?1:.55)+'"><title>Income '+fmt(d.inc)+'</title></rect>';
    s+='<rect x="'+(x+1)+'" y="'+(H-he)+'" width="'+bw+'" height="'+he+'" rx="3" fill="var(--exp)" opacity="'+(cur?1:.55)+'"><title>Expenses '+fmt(d.exp)+'</title></rect>';
    s+='<text x="'+x+'" y="'+(H+16)+'" text-anchor="middle" font-size="11" fill="var(--'+(cur?'ink':'mut')+')"'+(cur?' font-weight="600"':'')+'>'+label(d.k).replace(' 20',' ’')+'</text>';});
  s+='<line x1="0" x2="'+W+'" y1="'+H+'" y2="'+H+'" stroke="var(--line)"/></svg>';
  $('#chart').innerHTML=s;
  let t='<table><tr><th>Month</th><th>Income</th><th>Expenses</th><th>Net</th></tr>';
  data.slice().reverse().forEach(d=>{t+='<tr><td>'+label(d.k)+'</td><td>'+fmt(d.inc)+'</td><td>'+fmt(d.exp)+'</td><td class="'+(d.net<0?'neg':'pos')+'">'+fmt(d.net)+'</td></tr>';});
  const tot=data.reduce((a,d)=>a+d.net,0);
  t+='<tr><td><b>Cumulative</b></td><td></td><td></td><td class="'+(tot<0?'neg':'pos')+'"><b>'+fmt(tot)+'</b></td></tr></table>';
  $('#tbl').innerHTML=t;
}
function renderBar(){
  let b=document.querySelector('.bar');
  if(!b){b=document.createElement('div');b.className='bar';document.body.appendChild(b);}
  const msg=status||(dirty?(art?'Unsaved changes':'Saved on this phone'):'Saved on this phone');
  b.innerHTML='<span>'+msg+'</span>'+(art?'<button class="pri" data-act="save"'+(dirty?'':' disabled style="opacity:.5"')+'>Save</button>':'<span style="display:flex;gap:6px"><button data-act="export">Export</button><button data-act="import">Import</button></span>');
}
function buildDoc(){
  const css=document.getElementById('css').textContent,app=document.getElementById('app').textContent;
  const st=JSON.stringify(S).replace(/</g,'\\u003c');
  return '<!DOCTYPE html>\n<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Finances</title><style id="css">'+css+'</style></head><body><div id="root"></div><script id="state" type="application/json">'+st+'<\/script><script id="app">'+app+'<\/script></body></html>';
}
async function save(){
  if(!art)return;status='Saving…';renderBar();
  try{await art.publish(buildDoc());dirty=false;status='Saved';}
  catch(e){status=(e&&/not_granted|not_writer/.test(String(e.code||e.message||e)))?'Read-only: saved on this device':'Could not save, try again';}
  renderBar();
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='save')return save();
  if(a==='txtype'){txType=b.dataset.v;txManual=false;render();return;}
  if(a==='txdel'){const id=b.closest('.tx').dataset.tx;if(b.dataset.sure){S.tx=S.tx.filter(t=>t.id!==id);touch();refreshLog();}else{b.dataset.sure=1;b.textContent='Delete?';b.style.color='var(--neg)';}return;}
  if(a==='export'){const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const u=URL.createObjectURL(blob);const l=document.createElement('a');l.href=u;l.download='my-finances-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);status='Backup exported';renderBar();return;}
  if(a==='import'){const f=document.createElement('input');f.type='file';f.accept='application/json,.json';f.onchange=async()=>{try{const d=JSON.parse(await f.files[0].text());if(!d.months)throw 0;S=d;S.assets=S.assets||[];S.liabilities=S.liabilities||[];S.tx=S.tx||[];S.rules=S.rules||{};if(!S.months[S.current])S.current=Object.keys(S.months).sort().pop();touch();status='Backup imported';render();}catch(e){status='That file is not a valid backup';renderBar();}};f.click();return;}
  if(a==='tab'){view=b.dataset.v;try{history.replaceState(null,'',view==='rd'?'#rich-dad':view==='mes'?'#budget':'#log');}catch(_){}render();return;}
  if(a==='prev'||a==='next'){S.current=shift(S.current,a==='prev'?-1:1);render();return;}
  const m=S.months[S.current];
  if(a==='copy'){const src=S.months[b.dataset.from];S.months[S.current]={income:src.income.filter(i=>i.f!=='u').map(i=>({...i,id:uid()})),expenses:src.expenses.map(x=>({...x,id:uid()}))};}
  else if(a==='blank'){S.months[S.current]={income:[],expenses:[]};}
  else if(a==='add'){const t=b.dataset.t;list(t).push(t==='income'?{id:uid(),name:'',amt:0,f:'m',k:'w'}:t==='expenses'?{id:uid(),name:'',amt:0,car:false}:t==='assets'?{id:uid(),name:'',value:0,cf:0}:{id:uid(),name:'',bal:0,pay:0});}
  else if(a==='del'||a==='car'){const r=b.closest('.row'),l=list(r.dataset.t),i=l.findIndex(x=>x.id===r.dataset.id);if(i<0)return;if(a==='del')l.splice(i,1);else l[i].car=!l[i].car;}
  else if(a==='delmonth'){if(b.dataset.sure){delete S.months[S.current];}else{b.dataset.sure=1;b.textContent='Tap again to confirm';return;}}
  else return;
  touch();render();
  if(a==='add'){const rows=document.querySelectorAll('.row[data-t="'+b.dataset.t+'"]:not(.sub)');const last=rows[rows.length-1];if(last)last.querySelector('input').focus();}
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='txDesc'){if(!txManual)$('#txCat').value=classify(el.value,txType);return;}
  if(el.id==='txCat'){txManual=true;return;}
  if(el.id==='txAmt'||el.id==='txDate')return;
  if(el.dataset.txcat){const t=S.tx.find(x=>x.id===el.dataset.txcat);if(t){t.cat=el.value;if(t.desc)S.rules[t.type+':'+rkey(t.desc)]=el.value;touch();refreshLog();}return;}
  if(el.id==='transit'){S.transit=parseFloat(el.value)||0;touch();refresh();return;}
  const r=el.closest('.row');if(!r||!el.dataset.f||!r.dataset.t)return;
  const it=list(r.dataset.t).find(x=>x.id===r.dataset.id);if(!it)return;
  const f=el.dataset.f;it[f]=NUM.includes(f)?(parseFloat(String(el.value).replace(/[$,]/g,''))||0):el.value;
  touch();refresh();
});
render();
</script></body></html>
